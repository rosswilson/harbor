global
  log stdout format raw local0
defaults
  log global
  mode http
  timeout connect 1s
  timeout check 500ms
  timeout client 30s
  timeout server 30s
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s
frontend public
  bind *:8080
  default_backend gateways
backend gateways
  balance roundrobin
  # Retry a failed connection on the surviving gateway. Do not replay responses.
  option redispatch
  retries 1
  option httpchk
  http-check send meth GET uri /ready ver HTTP/1.1 hdr Host gateway
  http-check expect status 200
  default-server inter 500ms fastinter 250ms fall 2 rise 1 resolvers docker init-addr libc,none
  server gateway-a gateway-a:8080 check port 9901
  server gateway-b gateway-b:8080 check port 9901
