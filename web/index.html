<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Harbor local deployment and tenant release control" />
    <title>Harbor · Control plane</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#overview"
        ><span class="brand-mark">H</span> harbor<span class="brand-dot">.</span></a
      >
      <div class="workspace">
        <span class="live-dot"></span> Local workspace <span class="key">DEV</span>
      </div>
      <div class="nav-label">CONTROL PLANE</div>
      <nav aria-label="Main navigation">
        <a href="#overview" data-view="overview">◈ <span>Overview</span></a
        ><a href="#tenants" data-view="tenants">◎ <span>Tenants & domains</span></a
        ><a href="#deployments" data-view="deployments">▤ <span>Deployments</span></a
        ><a href="#releases" data-view="releases">↗ <span>Releases</span></a
        ><a href="#activity" data-view="activity">≋ <span>Activity</span></a
        ><a href="#integrations" data-view="integrations">⌘ <span>API & CLI</span></a>
      </nav>
      <div class="sidebar-bottom">
        <span class="live-dot"></span> Docker runtime
        <div>Envoy · xDS v3 / gRPC</div>
        <button class="text-button" data-action="logout">Change API token</button>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div>
          <span class="breadcrumb">Workspace</span><span class="slash">/</span
          ><span id="breadcrumb">Overview</span>
        </div>
        <div class="topbar-right">
          <span class="environment">LOCAL</span
          ><span id="connection" role="status">Connecting…</span>
        </div>
      </header>
      <main id="main"><div class="loading">Connecting to the control plane…</div></main>
      <footer>
        Harbor foundation <span>Local HTTP · logical cells · two gateway processes</span>
      </footer>
    </div>
    <dialog id="modal">
      <form id="form">
        <div class="modal-heading">
          <h2 id="modal-title"></h2>
          <button type="button" class="icon-button" data-action="close" aria-label="Close dialog">
            ×
          </button>
        </div>
        <div id="fields"></div>
        <div id="form-error" role="alert"></div>
        <div class="modal-footer">
          <button type="button" class="button secondary" data-action="close">Cancel</button
          ><button class="button" id="submit">Save</button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status"></div>
  </body>
</html>
